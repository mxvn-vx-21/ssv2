name = "stencyl"
main = "src/worker.js"
compatibility_date = "2026-10-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "stencyl"
database_id = "REPLACE_WITH_D1_ID"
# Secrets (wrangler secret put): ADMIN_PASSWORD, RESEND_API_KEY, DISCORD_WEBHOOK_URL
